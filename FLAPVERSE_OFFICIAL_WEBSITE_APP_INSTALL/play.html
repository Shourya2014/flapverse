<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b11"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png" type="image/png"><title>Play FLAPVERSE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050b11;font-family:Arial,sans-serif;overflow:hidden}.top{height:54px;background:#07131e;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:white}.brand{font-weight:1000;letter-spacing:1.5px}.brand b{color:#ffd84a}.tools{display:flex;gap:8px}.tools a,.tools button{border:0;border-radius:9px;background:#102a3d;color:#fff;padding:8px 12px;font-weight:900;cursor:pointer;text-decoration:none}.tools .play{background:#79e044;color:#14250d}.frame{width:100%;height:calc(100% - 54px);border:0;background:#111;display:block}@media(max-width:600px){.top{height:48px;padding:0 8px}.frame{height:calc(100% - 48px)}.brand{font-size:13px}.tools a,.tools button{padding:7px 9px;font-size:11px}.hide-mobile{display:none}}</style></head><body><div class="top"><a class="brand" href="index.html">FLAP<b>VERSE</b></a><div class="tools"><button id="install">⬇ INSTALL</button><button id="full">⛶ FULLSCREEN</button><a class="play" href="index.html">⌂ SITE</a></div></div><iframe class="frame" id="game" src="game/flapverse.html" allow="fullscreen; autoplay" title="FLAPVERSE game"></iframe><script>document.getElementById('full').onclick=async()=>{const el=document.documentElement;try{if(!(document.fullscreenElement||document.webkitFullscreenElement)){const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)await f.call(el);}else{const f=document.exitFullscreen||document.webkitExitFullscreen;if(f)await f.call(document);}}catch(e){}};;let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});document.getElementById('install').onclick=async()=>{if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){alert('FLAPVERSE is already installed.');return}if(dp){dp.prompt();await dp.userChoice;dp=null}else{alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'On iPhone/iPad: Safari → Share → Add to Home Screen.':'Use your browser menu and choose Install FLAPVERSE / Install app. Chrome or Edge works best.')}};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
