<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<title>Play FLAPVERSE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050b11;font-family:Arial,sans-serif;overflow:hidden}
.top{
  height:54px;background:#07131e;border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:white;position:relative;z-index:20
}
.brand{font-weight:1000;letter-spacing:1.5px;color:#fff;text-decoration:none}
.brand b{color:#ffd84a}
.tools{display:flex;gap:8px;align-items:center}
.tools a,.tools button{
  border:0;border-radius:9px;background:#102a3d;color:#fff;padding:8px 12px;
  font-weight:900;cursor:pointer;text-decoration:none
}
.tools .play{background:#79e044;color:#14250d}
#frame-wrap{
  position:relative;width:100%;height:calc(100% - 54px);overflow:hidden;background:#111
}
.frame{width:100%;height:100%;border:0;background:#111;display:block}
#landscape-note{
  display:none;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
  z-index:30;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
  color:#fff;border:1px solid rgba(255,216,74,.65);border-radius:14px;padding:10px 14px;
  text-align:center;font-size:12px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.4)
}
#landscape-note b{color:#ffd84a}
@media (max-width:600px){
  .top{height:48px;padding:0 8px}
  #frame-wrap{height:calc(100% - 48px)}
  .brand{font-size:13px}
  .tools a,.tools button{padding:7px 9px;font-size:11px}
}
body.portrait-mobile{
  background:#000;
}
body.portrait-mobile .top{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);
  width:calc(100% - 16px);height:auto;padding:7px 8px;border:1px solid rgba(255,255,255,.14);
  border-radius:16px;background:rgba(7,19,30,.88);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.3)
}
body.portrait-mobile .brand{
  font-size:12px;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
body.portrait-mobile .tools{gap:6px}
body.portrait-mobile .tools a,
body.portrait-mobile .tools button{
  padding:6px 8px;font-size:10px;border-radius:8px
}
body.portrait-mobile #frame-wrap{
  position:fixed;left:50%;top:50%;
  width:100dvh;height:100dvw;
  transform:translate(-50%,-50%) rotate(90deg);
  transform-origin:center center;
  background:#000;
}
body.portrait-mobile .frame{
  width:100%;height:100%;
}
body.portrait-mobile #landscape-note{
  display:block;
}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="index.html">FLAP<b>VERSE</b></a>
  <div class="tools">
    <button id="install">⬇ INSTALL</button>
    <button id="full">⛶ FULLSCREEN</button>
    <a class="play" href="index.html">⌂ SITE</a>
  </div>
</div>

<div id="frame-wrap">
  <iframe class="frame" id="game" src="game/flapverse.html" allow="fullscreen; autoplay" title="FLAPVERSE game"></iframe>
</div>

<div id="landscape-note">📱 <b>Landscape mode is enabled automatically.</b><br>Rotate your phone for the absolute best experience.</div>

<script>
const fullBtn=document.getElementById('full');
const installBtn=document.getElementById('install');
const frame=document.getElementById('game');
let dp=null;

function updateLayout(){
  const portraitMobile = window.innerWidth <= 900 && window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait-mobile', portraitMobile);
}

async function tryLandscapeLock(){
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
    }
  }catch(e){}
}

fullBtn.onclick=async()=>{
  const el=document.documentElement;
  try{
    if(!(document.fullscreenElement||document.webkitFullscreenElement)){
      const f=el.requestFullscreen||el.webkitRequestFullscreen;
      if(f) await f.call(el);
      await tryLandscapeLock();
    }else{
      const f=document.exitFullscreen||document.webkitExitFullscreen;
      if(f) await f.call(document);
    }
  }catch(e){}
};

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  dp=e;
});

installBtn.onclick=async()=>{
  if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){
    alert('FLAPVERSE is already installed.');
    return;
  }
  if(dp){
    dp.prompt();
    await dp.userChoice;
    dp=null;
  }else{
    alert(/iphone|ipad|ipod/i.test(navigator.userAgent)
      ? 'On iPhone/iPad: Safari → Share → Add to Home Screen.'
      : 'Use your browser menu and choose Install FLAPVERSE / Install app. Chrome or Edge works best.'
    );
  }
};

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

window.addEventListener('resize', updateLayout);
window.addEventListener('orientationchange', updateLayout);
window.addEventListener('load', ()=>{ updateLayout(); setTimeout(updateLayout, 400); });

document.addEventListener('click', tryLandscapeLock, {once:true});
document.addEventListener('touchstart', tryLandscapeLock, {once:true, passive:true});
</script>
</body>
</html>
